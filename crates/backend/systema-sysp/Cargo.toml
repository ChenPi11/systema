[package]
name = "systema-sysp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "System P — power-transition library (libsystema_sysp.so)"

# The library ships two artifacts:
#   * an rlib that System Init links statically and calls in-process, and
#   * a shared library (libsystema_sysp.so) exposing a C ABI so external
#     consumers (dlopen / initramfs helpers) can execute power transitions.
#
# Cargo forbids hyphens in library target names, so the on-disk artifact is
# `libsystema_sysp.so` (underscore); the crate is imported as `systema_sysp`.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
systema-sysf = { path = "../systema-sysf" }

anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
libc = "0.2"