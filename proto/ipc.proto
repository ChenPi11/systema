syntax = "proto3";

package ipc;

// The universal message envelope for all IPC communication between
// System A and System Workers.
message Envelope {
    // Monotonically increasing request ID (0 for one-way events).
    uint64 request_id = 1;
    // Sender identifier, e.g. "system-a" or "system-s".
    string source = 2;
    // Recipient identifier, e.g. "system-s" or "system-a".
    string target = 3;
    // Method/event name, e.g. "worker.register", "method.call".
    string method = 4;
    // Serialized payload (nested protobuf message).
    bytes payload = 5;
}

// Sent by a System Worker on connect to declare which unit types it handles.
message WorkerRegistration {
    // Unique ID of this worker instance, e.g. "system-s-1".
    string worker_id = 1;
    // Unit types this worker manages, e.g. ["service"].
    repeated string unit_types = 2;
    // True when this worker implements the `unit.define` protocol and can
    // synthesize definitions for dynamic units of its types on request
    // (System R: slice parent chains).  Workers without this flag are never
    // asked for definitions.
    bool supports_unit_define = 3;
}

// ──────────────────────────────────────────────────────────────────
// Generic method call / result
// ──────────────────────────────────────────────────────────────────

// Sent by System A to invoke a method on a unit managed by the worker.
// Methods: "status", "start", "stop", "restart", "reload"
message MethodCall {
    // Method name (e.g. "status", "start", "stop").
    string method = 1;
    // The target unit name.
    string unit_name = 2;
    // Method-specific serialized arguments.
    // For start/restart/reload this is a serialized UnitConfig.
    // For status/stop this is empty.
    bytes args = 3;
    // Unique invocation ID for this activation (UUID v4).
    // Set for start/restart calls; empty otherwise.
    string invocation_id = 4;
}

// Response from a worker to a MethodCall.
message MethodResult {
    // Echoes the method name from the call.
    string method = 1;
    // Echoes the unit name from the call.
    string unit_name = 2;
    // True if the call succeeded.
    bool success = 3;
    // Human-readable error message (empty on success).
    string error = 4;
    // Method-specific serialized result.
    // For "status" this is a serialized UnitStatus.
    // For other methods this is empty.
    bytes result = 5;
}

// Runtime state snapshot returned by a "status" call.
message UnitStatus {
    // Unit name.
    string unit_name = 1;
    // Active state: "active", "inactive", "activating", "deactivating", "failed".
    string active_state = 2;
    // Worker-specific sub-state (e.g. "running", "mounted", "listening", "dead").
    string sub_state = 3;
    // PID of the main process, or 0 if not running / not applicable.
    uint32 main_pid = 4;
    // Invocation ID (UUID v4) of the current activation, if any.
    string invocation_id = 5;
    // Worker-specific key-value extensions for properties that don't fit
    // the common schema (e.g. "exec_main_code", "n_accepted").
    map<string, string> extensions = 6;
}

// Sent by System A to acknowledge a worker registration.
message RegisterAck {
    bool accepted = 1;
    string message = 2;
}

// Sent by a System Worker once its registration is accepted and its initial
// full state snapshot has been published.  Fire-and-forget (no ACK): System A
// marks the worker ready and broadcasts `WORKER_READY=<worker_id>` on the
// notify channel so SysAInit can advance its serial startup sequence.
message WorkerReady {
    // Empty — the worker's identity is the envelope's source field.
}

// Sent by a Worker to System A to report runtime state changes for one or
// more units.  This is the unified state-update channel.
message UnitStateUpdate {
    // States of the affected units (may be empty for a pure ACK probe).
    repeated UnitStatus units = 1;
    // True when this is a complete snapshot of every unit managed by the
    // worker (sent on connect/reconnect and in response to UnitSyncRequest).
    // Full snapshots are accepted unconditionally; incremental updates are
    // validated against the unit ownership table.
    bool full_snapshot = 2;
    // Monotonically increasing sequence number for ordering/dedup (0 = not set).
    uint64 seq = 3;
}

// Sent by System A to acknowledge a UnitStateUpdate.
message UnitStateUpdateAck {
    // True if the update was accepted.
    bool accepted = 1;
    // Units that were ignored (unknown or not owned by the sender).
    repeated string ignored_units = 2;
    // Human-readable message (empty on success).
    string message = 3;
}

// Sent by System A to a Worker to request a full state snapshot.
// The Worker replies with a UnitStateUpdate carrying full_snapshot=true.
message UnitSyncRequest {
    // Empty — reserved for future filter fields.
}

// Sent by a Worker to System A to subscribe to `event.publish` notifications
// for a specific set of units.  An empty `unit_names` list subscribes to
// updates for *all* units.  Each call adds to the worker's existing
// subscription.
message EventSubscribe {
    // Unit names to subscribe to; empty = all units.
    repeated string unit_names = 1;
}

// Sent by a Worker to System A to cancel one or more unit subscriptions.
// An empty `unit_names` list removes every subscription (including an
// all-units subscription).
message EventUnsubscribe {
    // Unit names to unsubscribe from; empty = unsubscribe from all.
    repeated string unit_names = 1;
}

// Sent by a Worker in response to UnitSyncRequest.  Identical to a
// full-snapshot UnitStateUpdate; kept as a separate message so the two
// directions use distinct payload types.
message UnitSyncReport {
    // The full snapshot of every unit managed by this worker.
    UnitStateUpdate snapshot = 1;
}

// Sent by a System Worker to register discovered units as JSON-serialized
// UnitIR values bound to the caller's PID.
message RegisterUnits {
    // Name for the staging area (not used for identity).
    string name = 1;
    // JSON-serialized map of unit_id → UnitIR.
    bytes units_json = 2;
}

// Sent by a System Worker to commit its staging area.
// The area is identified by the (uid, name) pair.
message CommitUnits {
    // Name of the staging area to commit.
    string name = 1;
    // Owner UID of the staging area to commit; 0 = caller's own UID.
    // Non-root callers may only commit areas owned by their own UID;
    // root may commit any staging area.
    uint32 uid = 2;
}

// Sent by a System Worker to query a staging area.
message StagingQuery {
    // Name of the staging area to query.
    string name = 1;
    // Owner UID of the staging area to query; 0 = caller's own UID.
    // Non-root callers may only query areas owned by their own UID;
    // root may query any staging area.
    uint32 uid = 2;
}

// Response to a StagingQuery (worker's own area).
message StagingQueryResult {
    // True if the staging area was found.
    bool success = 1;
    // Human-readable message (empty on success).
    string message = 2;
    // JSON-serialized map of unit_id → UnitIR (empty on failure).
    bytes units_json = 3;
    // Number of units in the staging area (0 on failure).
    uint32 unit_count = 4;
}

// Sent by System A to acknowledge a unit registration or commit.
message UnitRegistrationAck {
    bool success = 1;
    string message = 2;
    uint32 unit_count = 3;
}

// Sent by System A to a worker (e.g. System R) to request the on-demand
// definition of units that are referenced (e.g. via Requires=/Slice=) but
// not loaded — the `unit.define` materialization protocol.  The worker that
// owns the unit type synthesizes the definitions from its domain knowledge
// (System R: slice parent chains) instead of the disk.
message UnitDefineRequest {
    // Unit names whose definitions are requested (e.g. "user-0.slice").
    repeated string unit_names = 1;
}

// Reply to a UnitDefineRequest, echoed on the same request_id.
message UnitDefineResult {
    bool success = 1;
    // Human-readable error message (empty on success).
    string error = 2;
    // JSON-serialized map of unit_id → UnitIR (same format as the finder
    // staging area) with the synthesized definitions; empty on failure.
    bytes units_json = 3;
}

// --- Staging area administration (root / systema-uid only) ---

// Query a staging area or list all areas.
message AdminStagingOp {
    // "list"         → return (uid, name) for every area
    // "by_uid"       → return full data for every area owned by the given uid
    // "by_name"      → return full data for every area with the given name
    // "by_id"        → return full data for the (uid, name) area
    // "all"          → return full data for every area
    string op = 1;
    // UID filter for "by_uid" / "by_id" operations.
    uint32 uid = 2;
    // Name filter for "by_name" / "by_id" operations.
    string name = 3;
}

// One entry in an AdminStagingResult.
message StagingAreaEntry {
    uint32 uid = 1;
    string name = 2;
    uint32 unit_count = 3;
    // JSON-serialized map of unit_id → UnitIR (empty for "list").
    bytes units_json = 4;
}

// Response to AdminStagingOp.
message AdminStagingResult {
    bool success = 1;
    string message = 2;
    repeated StagingAreaEntry entries = 3;
}

// ──────────────────────────────────────────────────────────────────
// Control plane (SysAInit → System A)
// ──────────────────────────────────────────────────────────────────

// One unit entry returned by "manager.list_units".
message UnitInfo {
    // Unit name, e.g. "default.target".
    string name = 1;
    // Unit type, e.g. "service", "target", "socket".
    string unit_type = 2;
    // True when the unit is enabled (a wants/requires link or a primary
    // enablement link exists under a system unit directory).
    bool enabled = 3;
}

// Request to list the units System A has loaded.
message ListUnitsRequest {
    // When true, only enabled units are returned.
    bool enabled_only = 1;
}

// Response to ListUnitsRequest.
message ListUnitsResult {
    bool success = 1;
    // Human-readable message (empty on success).
    string message = 2;
    repeated UnitInfo units = 3;
}

// Request to start a batch of units.  Each name is enqueued as an
// independent start job with dependency expansion (systemd `systemctl
// start a b c` semantics); unknown names are rejected without blocking
// the rest.
message StartUnitsRequest {
    repeated string names = 1;
}

// Outcome of starting one unit.
message UnitStartResult {
    string name = 1;
    bool success = 2;
    // Human-readable message (empty on success; reason on rejection).
    string message = 3;
}

// Response to StartUnitsRequest.
message StartUnitsResult {
    bool success = 1;
    repeated UnitStartResult results = 2;
}

// Request to stop a single unit.
message StopUnitsRequest {
    string name = 1;
}

// Response to StopUnitsRequest.
message StopUnitsResult {
    bool success = 1;
    // Human-readable message (empty on success).
    string message = 2;
}

// Configuration for a .socket unit, sent inside UnitConfig.
message SocketConfig {
    // Addresses to listen on — see SocketAddress below.
    repeated SocketAddress listen = 1;
    // Accept=yes -> per-connection service; Accept=no -> passive socket.
    bool accept = 2;
    // listen() backlog (kernel default if 0).
    uint32 backlog = 3;
    // Socket file mode (numeric, e.g. "0666").
    string socket_mode = 4;
    // Socket user/group for Unix sockets.
    string socket_user = 5;
    string socket_group = 6;
    // Associated service unit name.
    string service = 7;
    // Permission mode for automatically created socket directories (e.g. "0755").
    string directory_mode = 8;
}

// One listen address in a SocketConfig.
message SocketAddress {
    // ListenStream= address, e.g. "0.0.0.0:8080", "/run/foo.sock".
    string stream = 1;
    // ListenDatagram= address.
    string datagram = 2;
    // ListenSequentialPacket= address.
    string sequential_packet = 3;
    // ListenFIFO= path.
    string fifo = 4;
}

// Configuration for a .mount unit, sent inside UnitConfig.
message MountConfig {
    // Device or remote filesystem to mount (What=).
    string what = 1;
    // Mount point path (Where=).
    string where = 2;
    // Filesystem type, e.g. "ext4", "nfs" (Type=).
    string type = 3;
    // Mount options passed to mount(8) (Options=).
    string options = 4;
    // Time to wait for the mount operation in seconds (TimeoutSec=).
    uint32 timeout_sec = 5;
    // Unmount lazily (LazyUnmount=).
    bool lazy_unmount = 6;
    // Force unmount even if busy (ForceUnmount=).
    bool force_unmount = 7;
    // Permission mode for the mount point directory (DirectoryMode=).
    string directory_mode = 8;
    // Ignore unknown mount options (SloppyOptions=).
    bool sloppy_options = 9;
}

// Configuration for a .automount unit, sent inside UnitConfig.
message AutomountConfig {
    // Mount point path (Where=).
    string where = 1;
    // Extra mount options passed to the autofs mount (ExtraOptions=).
    string extra_options = 2;
    // Idle timeout in seconds after which the mount is unmounted (TimeoutIdleSec=).
    uint32 timeout_idle_sec = 3;
    // Permission mode for the mount point directory (DirectoryMode=).
    string directory_mode = 4;
}

// Configuration for a .timer unit, sent inside UnitConfig.
message TimerConfig {
    // Monotonic triggers (seconds relative to an anchor); unset = disabled.
    optional uint32 on_active_sec = 1;        // after this timer unit was activated
    optional uint32 on_boot_sec = 2;          // after the machine booted
    optional uint32 on_startup_sec = 3;        // after the service manager started
    optional uint32 on_unit_active_sec = 4;    // periodically, after the trigger unit became active
    optional uint32 on_unit_inactive_sec = 5;  // periodically, after the trigger unit became inactive
    // Wall-clock triggers in systemd OnCalendar= syntax (repeat forever).
    repeated string on_calendar = 6;
    // Trigger tolerance (AccuracySec=), in seconds; default 60.
    uint32 accuracy_sec = 7;
    // Random delay added to each elapse (RandomizedDelaySec=), in seconds.
    uint32 randomized_delay_sec = 8;
    // Unit to activate when the timer fires (Unit=).  Defaults to the
    // sibling ".service" unit with the same base name.
    string unit = 9;
    // Catch up on missed calendar elapses after (re)start (Persistent=).
    bool persistent = 10;
}

// Configuration for a .device unit, sent inside UnitConfig.
message DeviceConfig {
    // Rule: the basename of the device node as seen in /dev,
    // e.g. "sda"; DeviceName=.
    string device_name = 1;
    // Rule: a path in /dev, e.g. "/dev/sda"; DevicePath=.
    string device_path = 2;
    // Rule: a sysfs path of the device, e.g. "/sys/devices/.../sda"; SysfsPath=.
    string sysfs_path = 3;
    // Rule: sysfs attribute matches in "attr=value" form; Property=.
    repeated string property = 4;
}

// Sent by System C (the timer worker) to System A when a timer fires,
// asking System A to activate the timer's target unit.
message TimerFired {
    // The timer unit that fired, e.g. "backup.timer".
    string timer_unit = 1;
    // The unit to activate, e.g. "backup.service".
    string target_unit = 2;
    // When the trigger elapse occurred (unix epoch seconds).
    uint64 elapse_epoch = 3;
}

// Configuration for a .path unit, sent inside UnitConfig.
message PathConfig {
    // Activate when the path exists (PathExists=).
    repeated string path_exists = 1;
    // Activate when a path matching the glob exists (PathExistsGlob=).
    repeated string path_exists_glob = 2;
    // Activate when the path is created or modified (PathChanged=).
    repeated string path_changed = 3;
    // Activate when the path is modified (PathModified=).
    repeated string path_modified = 4;
    // Activate when the directory is non-empty (DirectoryNotEmpty=).
    repeated string directory_not_empty = 5;
    // Unit to activate when the path triggers (Unit=).  Defaults to the
    // sibling ".service" unit with the same base name.
    string unit = 6;
    // Create watched directories before watching (MakeDirectory=).
    bool make_directory = 7;
    // Permission mode for auto-created directories (DirectoryMode=), e.g. "0755".
    string directory_mode = 8;
    // Trigger rate-limit interval in seconds (TriggerLimitIntervalSec=);
    // 0 disables rate limiting.  Default 2.
    uint32 trigger_limit_interval_sec = 9;
    // Trigger rate-limit burst count (TriggerLimitBurst=); 0 disables rate
    // limiting.  Default 200.
    uint32 trigger_limit_burst = 10;
}

// Sent by System P (the path worker) to System A when a monitored path
// condition is satisfied, asking System A to activate the path unit's target.
message PathFired {
    // The path unit that fired, e.g. "foo.path".
    string path_unit = 1;
    // The unit to activate, e.g. "foo.service".
    string target_unit = 2;
    // When the trigger occurred (unix epoch seconds).
    uint64 fired_epoch = 3;
}

// ──────────────────────────────────────────────────────────────────
// Resource control (System R)
// ──────────────────────────────────────────────────────────────────

// Resource-control (cgroup) limits for a unit: the UnitIR `resource_control`
// projection sent to System R.  String values keep their unit-file form
// (e.g. "50%", "1G", "100ms") so the cgroup backend can parse them with the
// precision it needs.
message ResourceConfig {
    // CPUQuota= — e.g. "50%".
    string cpu_quota = 1;
    // CPUQuotaPeriodSec= — e.g. "100ms".
    string cpu_quota_period = 2;
    // CPUWeight= (default 100).
    uint32 cpu_weight = 3;
    // StartupCPUWeight= (used during early boot).
    uint32 startup_cpu_weight = 4;
    // CPUSetCPUs= — e.g. "0-3".
    string cpu_set_cpus = 5;
    // CPUSetMemoryNodes= — e.g. "0".
    string cpu_set_memory_nodes = 6;
    // MemoryMin= — e.g. "128M".
    string memory_min = 7;
    // MemoryLow= — e.g. "256M".
    string memory_low = 8;
    // MemoryHigh= — e.g. "512M".
    string memory_high = 9;
    // MemoryMax= — e.g. "1G".
    string memory_max = 10;
    // MemorySwapMax= — e.g. "512M".
    string memory_swap_max = 11;
    // IOWeight= (default 100).
    uint32 io_weight = 12;
    // StartupIOWeight= (used during early boot).
    uint32 startup_io_weight = 13;
    // Per-device IO weights, e.g. "/dev/sda 100".
    repeated string io_device_weight = 14;
    // Per-device read bandwidth limits, e.g. "/dev/sda 10M".
    repeated string io_read_bandwidth_max = 15;
    // Per-device write bandwidth limits.
    repeated string io_write_bandwidth_max = 16;
    // TasksMax= (0 / max = unlimited).
    uint32 tasks_max = 17;
    // AllowedCPUs= — e.g. "0-3".
    string allowed_cpus = 18;
    // AllowedMemoryNodes= — e.g. "0".
    string allowed_memory_nodes = 19;
}

// The UnitIR projection pushed to System R whenever a unit's runtime state
// changes.  Carries everything System R needs to (re)apply cgroup resource
// control: the `[Unit] Slice=` parent and the resource-control limits.
message UnitResourceEvent {
    string unit_name = 1;
    // active_state of the unit when the event was emitted
    // ("active", "inactive", "failed", ...).  System R applies the limits on
    // "active" and releases the entry on "inactive"/"failed".
    string active_state = 2;
    // Parent slice from [Unit] Slice=; empty means the default (system.slice).
    string slice = 3;
    // The resource-control limits (empty when the unit sets none).
    ResourceConfig resource = 4;
    // Main process PID to move into the unit's cgroup (0 = none/n/a).
    // Kept for backward compatibility; new senders fill `pids` instead.
    uint32 main_pid = 5;
    // Process PIDs to move into the unit's cgroup (empty = none/n/a).
    // Scopes wrap externally-created processes, so this may carry several
    // PIDs at once (from the transient `PIDs=` property).
    repeated uint32 pids = 6;
}

// Periodic cgroup runtime metrics pushed by System R to System A.
// Fire-and-forget (no ACK); System A caches the snapshot opaquely and
// serves it from the systemd-compatible D-Bus properties.
message CgroupMetricsUpdate {
    // Metrics for the currently managed (active) units.
    repeated UnitCgroupMetrics units = 1;
}

// One unit's cgroup metrics snapshot.
message UnitCgroupMetrics {
    string unit_name = 1;
    // systemd-style cgroup path, e.g. "/system.slice/app.service".
    string control_group = 2;
    // Inode of the unit's cgroup directory (ControlGroupId=).
    uint64 control_group_id = 3;
    // Runtime metrics keyed by the systemd property name they serve,
    // e.g. "MemoryCurrent", "CPUUsageNSec", "TasksCurrent".  System A
    // never interprets the values; it only relays them.
    map<string, uint64> metrics = 4;
    // Processes in the unit's cgroup subtree (for Unit.GetProcesses and
    // Manager.GetUnitProcesses), each tagged with its subpath.
    repeated CgroupProcess processes = 5;
}

// One process inside a unit's cgroup.
message CgroupProcess {
    // cgroup subpath relative to the unit's own cgroup ("" = the unit's
    // own cgroup, e.g. "system.slice/sshd.service").
    string subpath = 1;
    uint32 pid = 2;
    // Process comm (from /proc/<pid>/comm), may be empty.
    string name = 3;
}

// Sent by System A to the System E worker to abandon a scope: the scope's
// controller gave up on it (explicit `AbandonScope` / scope `Abandon`), so
// the worker must stop managing it and release its resources — the wrapped
// processes themselves are left running.
message ScopeAbandon {
    string unit_name = 1;
}

// Sent to the System R worker to report the number of active login sessions
// for one user (systemd-logind semantics: `user-<UID>.slice` exists as long
// as at least one session of that user is logged in).
//
// The count is absolute and idempotent: the slice's cgroup hierarchy
// (`user.slice/<UID>.slice`) is created on the 0 → N transition and
// released best-effort on the N → 0 transition.  The `user.slice` root is
// always present once System R is up.
message UserSessionEvent {
    uint32 uid = 1;
    // Absolute number of live sessions for this user.
    uint32 sessions = 2;
}

// Minimal unit configuration sent from System A to System Workers.
message UnitConfig {
    string unit_name = 1;
    string description = 2;
    // For service units.
    ServiceConfig service = 3;
    // For socket units.
    SocketConfig socket = 4;
    // For mount units.
    MountConfig mount = 5;
    // For automount units.
    AutomountConfig automount = 6;
    // For timer units.
    TimerConfig timer = 7;
    // For device units.
    DeviceConfig device = 8;
    // For path units.
    PathConfig path = 9;
    // For scope units.
    ScopeConfig scope = 10;
    // Socket units this unit depends on (Requires=/BindsTo= *.socket).
    // The service worker requests their listener fds (LISTEN_FDS) from the
    // socket worker when starting the process (socket activation).
    repeated string socket_units = 11;
}

message ServiceConfig {
    string exec_start = 1;
    string exec_stop = 2;
    string exec_reload = 3;
    string working_directory = 4;
    string user = 5;
    string group = 6;
    repeated string environment = 7;
    string restart_policy = 8;   // "no", "on-failure", "always"
    uint32 restart_delay_secs = 9;
    string service_type = 10;    // "simple", "forking", "oneshot", "notify"
    string pid_file = 11;
    uint32 timeout_start_secs = 12;
    uint32 timeout_stop_secs = 13;
    string standard_input = 14;
    string standard_output = 15;
    string standard_error = 16;
    string tty_path = 17;
    // RemainAfterExit=yes: the service stays "active" after its main process
    // exits successfully (oneshot style), instead of going inactive.
    bool remain_after_exit = 18;
}

// Configuration for `.scope` units, sent to the System E worker.
//
// Scopes wrap externally-created processes (not spawned by systemd): the
// caller passes the PIDs via the transient `PIDs=` property and the worker
// attaches them to the scope's cgroup.  The scope runs until its cgroup
// becomes empty, is stopped, or its controller abandons it.
message ScopeConfig {
    // Processes wrapped by the scope (`PIDs=`).
    repeated uint32 pids = 1;
    // Timeout for the scope in seconds (`TimeoutStopSec=`, default 90).
    uint32 timeout_stop_secs = 2;
    // Runtime timeout in seconds (`RuntimeMaxSec=`, 0 = unlimited).
    uint32 runtime_max_secs = 3;
    // Signal to send when stopping (`KillSignal=`, default SIGTERM).
    string kill_signal = 4;
    // Whether to send SIGHUP before SIGKILL (`SendSIGHUP=`).
    bool send_sighup = 5;
    // D-Bus name of the controller that created the scope.
    string controller = 6;
    // Parent slice from [Unit] Slice=; empty means the default (system.slice).
    string slice = 7;
}
